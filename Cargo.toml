[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Stiven-Gjekaj/OnyxDiskInfo"
authors = ["Stiven Gjekaj <stivenagostingjekaj@gmail.com>"]

# Each version is exact. A new version of a dependency is a commit of its own,
# so a change in behaviour has one place to look.
[workspace.dependencies]
onyx = { path = "crates/onyx" }
onyx-bench = { path = "crates/onyx-bench" }
onyx-core = { path = "crates/onyx-core" }
onyx-layout = { path = "crates/onyx-layout" }
onyx-probe = { path = "crates/onyx-probe" }
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
serde_json = "=1.0.151"
slint = "=1.18.1"
slint-build = "=1.18.1"
winresource = "=0.1.31"
thiserror = "=2.0.21"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` and not `forbid`: a host shim calls the host API, and it allows
# unsafe code for itself with the reason next to it. `forbid` refuses that.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
