# Every action is pinned to the commit of a release, and not to a tag.
# A tag moves. This project asks for root when it runs, so the gate that
# checks it is pinned too.
#
# dtolnay/rust-toolchain usually reads the toolchain from the name of the ref,
# as in `@stable`. A pinned commit has no such name, so the toolchain is
# named in `with`. It is the version in rust-toolchain.toml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check on ${{ matrix.os }}
    strategy:
      # One host that fails must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Slint draws its text through fontconfig and reads the keyboard through
      # xkbcommon on Linux, and the desktop app needs both to build.
      - name: install the libraries of Slint on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      # Clippy compiles the tests as well, so it reports what rustc reports.
      # RUSTFLAGS stays unset, so this step and the next share one build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # No test opens a device, so this step is the only place that proves
      # the device layer of a host runs at all. It reads the list of drives,
      # compares it with the tool of the host, and writes nothing.
      #
      # It also proves that the list needs no privilege on Linux and on
      # macOS, where the runner is an ordinary user. It proves nothing of the
      # kind on Windows, where the runner is an Administrator.
      - run: cargo build -p onyx --locked
      - name: list the drives
        run: cargo run -p onyx --locked -- list
      - name: compare the list with the tool of the host
        if: runner.os != 'Windows'
        run: python3 scripts/check-list.py target/debug/onyx
      - name: compare the list with the tool of the host
        if: runner.os == 'Windows'
        run: python scripts/check-list.py target/debug/onyx.exe

      # The exit test of P2 and P3. smartctl reads the same drives, and the
      # script compares the two. A drive that reports no health gets a
      # measured record. Linux needs root for the pass-through of both tools,
      # and every host needs it to read a sample of a raw drive. The Windows
      # runner is an Administrator already.
      - name: install smartmontools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y smartmontools
      - name: install smartmontools on macOS
        if: runner.os == 'macOS'
        run: brew install smartmontools
      - name: install smartmontools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey downloads the installer from SourceForge, which a runner
        # cannot always reach. Three tries, ten seconds apart.
        run: |
          foreach ($try in 1..3) {
            choco install smartmontools -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 10
          }
          "C:\Program Files\smartmontools\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: compare the health with smartctl on Linux
        if: runner.os == 'Linux'
        run: sudo python3 scripts/check-health.py target/debug/onyx
      # sudo, so that Onyx can read a sample of a drive that reports no
      # health. The runner has only such drives.
      - name: compare the health with smartctl on macOS
        if: runner.os == 'macOS'
        run: sudo python3 scripts/check-health.py target/debug/onyx
      - name: compare the health with smartctl on Windows
        if: runner.os == 'Windows'
        run: python scripts/check-health.py target/debug/onyx.exe

      # The exit test of P4. The device mapper builds a fake drive, and Onyx
      # must find it. fio runs the jobs of CrystalDiskMark, and the speeds of
      # Onyx must be within 10 percent of them. The benchmark uses a release
      # build, as a person does.
      - name: find a fake drive on Linux
        if: runner.os == 'Linux'
        run: sudo scripts/check-capacity.sh target/debug/onyx
      # The exit test of P5. The app runs with no display, with the MCP
      # server of Slint, and the script compares what it shows with what
      # onyx prints for each drive. Both run with the same rights.
      - name: build the desktop app with the MCP server
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        run: cargo build -p onyx-gui -p onyx --features slint/mcp --locked
      - name: compare the desktop app with onyx on Linux and macOS
        if: runner.os != 'Windows'
        run: sudo python3 scripts/check-gui.py target/debug/OnyxDiskInfo target/debug/onyx --headless
      - name: compare the desktop app with onyx on Windows
        if: runner.os == 'Windows'
        run: python scripts/check-gui.py target/debug/OnyxDiskInfo.exe target/debug/onyx.exe --headless

      # The exit test of P6 for the file systems that Onyx writes. Onyx
      # formats an image with each table and each file system, and the host
      # checks it with its own tool, mounts it, and writes a file to it.
      - name: install the check tools of FAT and exFAT on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs
          # The kernel of the runner finds no exFAT driver until the extra
          # modules of that kernel are in.
          if ! sudo modprobe exfat; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe exfat
          fi
      - name: check what onyx format writes on Linux
        if: runner.os == 'Linux'
        run: sudo python3 scripts/check-format.py target/debug/onyx
      - name: check what onyx format writes on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/check-format.py target/debug/onyx
      - name: check what onyx format writes on Windows
        if: runner.os == 'Windows'
        run: python scripts/check-format.py target/debug/onyx.exe

      # A report and not a gate. The disk of a cloud runner changes its speed
      # from minute to minute: two runs of fio in one job differed by up to
      # 28 percent, so a limit of 10 percent fails for the runner and not for
      # Onyx. The exit test of the benchmarks runs on a quiet local drive,
      # and docs/roadmap.md holds its result.
      - name: compare the benchmarks with fio on Linux
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y fio
          cargo build --release -p onyx --locked
          python3 scripts/check-bench.py target/release/onyx "$RUNNER_TEMP"

  # A shim that belongs to one host is compiled only on that host, so a break
  # in it waits for that job. `cargo clippy` does not link, so this catches
  # the break from Linux in about a minute.
  other-targets:
    name: check the other hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
