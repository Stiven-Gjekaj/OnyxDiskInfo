# A one-off experiment: the benchmark check on six runners. This branch is
# deleted after the run.
name: bench-experiment
on: pull_request
permissions:
  contents: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - run: sudo apt-get update && sudo apt-get install -y fio
      - run: cargo build --release --locked -p onyx
      - run: |
          echo "runner $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
      - run: python3 scripts/check-bench.py target/release/onyx "$RUNNER_TEMP"
