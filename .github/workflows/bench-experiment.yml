# A one-off experiment: why Onyx writes 4K at random faster than fio on the
# disk of a Linux runner. This branch is deleted after the run.
name: bench-experiment
on: pull_request
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - run: sudo apt-get update && sudo apt-get install -y fio
      - run: cargo build --release --locked -p onyx
      - name: run fio four ways around onyx
        run: |
          set -eu
          f="$RUNNER_TEMP/onyx-bench.tmp"
          target/release/onyx bench --file "$f" --keep --seconds 1 --json > /dev/null
          job() {
            fio --name=x --filename="$f" --size=1g --rw="$1" --bs=4k --numjobs=1 \
              --ioengine="$2" --iodepth=1 --direct=1 --runtime=5 --time_based \
              --output-format=json | jq ".jobs[0].${3}.bw_bytes / 1e6 | floor"
          }
          onyx() {
            target/release/onyx bench --file "$f" --reuse --keep --seconds 5 --json \
              | jq -r '.jobs[] | select(.job == "RND4K Q1T1") | (if .write then "write " else "read " end) + (.bytes_per_second / 1e6 | floor | tostring)' | tr '\n' ' '
          }
          for round in 1 2 3; do
            for engine in libaio psync io_uring; do
              echo "round $round: fio $engine write $(job randwrite $engine write) read $(job randread $engine read)"
            done
            echo "round $round: onyx $(onyx)"
          done
