<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OnyxDiskInfo">
  <title>OnyxDiskInfo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b22"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- The platter of a disk, cut like a stone. -->
  <polygon points="128,36 208,82 208,174 128,220 48,174 48,82" fill="#18181b" stroke="#3f3f46" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="128,36 208,82 128,128 48,82" fill="#27272a"/>
  <polygon points="128,128 208,82 208,174 128,220" fill="#111114"/>
  <!-- The white band of an onyx, as the ring of a health gauge. -->
  <circle cx="128" cy="128" r="46" fill="none" stroke="url(#band)" stroke-width="14" stroke-linecap="round" stroke-dasharray="230 289" transform="rotate(-90 128 128)"/>
  <circle cx="128" cy="128" r="12" fill="#f4f4f5"/>
</svg>
