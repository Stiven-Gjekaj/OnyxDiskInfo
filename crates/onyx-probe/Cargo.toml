[package]
name = "onyx-probe"
description = "The part of Onyx that asks each host about its drives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
onyx-core.workspace = true


# The bindings of one host never reach the other two. Each one is raw, so the
# shim that uses it stays thin and the decisions stay in a pure module that
# every host compiles.
# The ioctls of the health commands on Linux have no equivalent in the
# standard library.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
io-kit-sys = "=0.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[lints]
workspace = true
