[package]
name = "onyx-probe"
description = "The part of Onyx that asks each host about its drives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
onyx-core.workspace = true


# The bindings of one host never reach the other two. Each one is raw, so the
# shim that uses it stays thin and the decisions stay in a pure module that
# every host compiles.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
io-kit-sys = "=0.4.1"

[lints]
workspace = true
