[package]
name = "onyx-gui"
description = "The desktop app of Onyx, in the style of CrystalDiskInfo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "OnyxDiskInfo"
path = "src/main.rs"

[dependencies]
# The app shows what `onyx health --json` prints, so it builds its view from
# that JSON, whichever way the JSON came.
onyx.workspace = true
onyx-core.workspace = true
onyx-probe.workspace = true
serde_json.workspace = true
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
